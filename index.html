<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#cfe1ee">
  <title>Coastline Cruiser: Bunbury</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <canvas id="minimap" aria-label="Minimap"></canvas>
    <div id="street" aria-live="polite"></div>
    <div id="speedo">
      <div><span id="speed-val">0</span><span class="unit">km/h</span></div>
      <div id="gear">D</div>
    </div>
    <div id="hud-buttons">
      <button id="btn-cam" title="Switch camera (C)">CAM</button>
      <button id="btn-reset" title="Reset car to road (R)">RESET</button>
    </div>
    <div id="msg"></div>
    <div id="stats"></div>
    <div id="credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
  </div>

  <div id="touch">
    <div id="steer-zone">
      <div id="steer-base"><div id="steer-knob"></div></div>
      <div class="hint">steer</div>
    </div>
    <div id="pedals">
      <button id="btn-hand" class="pedal small">HAND<br>BRAKE</button>
      <button id="btn-brake" class="pedal">BRAKE</button>
      <button id="btn-gas" class="pedal big">GAS</button>
    </div>
  </div>

  <div id="loading"><div class="title">Coastline Cruiser</div><div id="loading-text">Loading…</div><div class="sub">Bunbury, Western Australia · map data © OpenStreetMap contributors</div></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
